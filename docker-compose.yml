services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bank
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  # mailpit:
  #   image:  axllent/mailpit
  #   container_name: mailpit
  #   restart: always
  #   ports:
  #     - 8025:8025
  #     - 1025:1025

volumes:
  postgres_data:
